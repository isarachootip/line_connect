# ไปป์ไลน์ตรวจสอบคุณภาพโค้ดอัตโนมัติ (Lint, Typecheck, Prisma Validate และ Unit Test)
name: Line Connect CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://lineconnect:lineconnect_dev_pwd@localhost:5432/line_connect_db?schema=public

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Package & Generate Prisma Client
        run: |
          npm run build --workspace=@line-connect/shared
          npm run prisma:validate --workspace=@line-connect/backend
          npm run prisma:generate --workspace=@line-connect/backend

      - name: Run ESLint (Zero Any Policy)
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Unit Tests Across All Workspaces
        run: npm test
