# ไปป์ไลน์ตรวจสอบคุณภาพโค้ดอัตโนมัติ (Lint, Test, Build) ทุก Pull Request และการ Push
name: Line Connect CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['*']

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://lineconnect:lineconnect_dev_pwd@localhost:5432/line_connect_db?schema=public

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema & Generate Client
        run: |
          npm run build --workspace=@line-connect/shared
          npm run prisma:validate --workspace=@line-connect/api
          npm run prisma:generate --workspace=@line-connect/api

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Build All Workspaces (shared, api, liff)
        run: npm run build
