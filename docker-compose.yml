# บริการโครงสร้างพื้นฐานสำหรับรันระบบ Line Connect บนเครื่อง Local (api, postgres, redis)
services:
  postgres:
    image: postgres:16-alpine
    container_name: line_connect_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lineconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lineconnect_dev_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-line_connect_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lineconnect -d line_connect_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: line_connect_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: line_connect_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-dev}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lineconnect}:${POSTGRES_PASSWORD:-lineconnect_dev_pwd}@postgres:5432/${POSTGRES_DB:-line_connect_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '${PORT:-3000}:3000'

volumes:
  postgres_data:
  redis_data:
