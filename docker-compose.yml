# บริการโครงสร้างพื้นฐานสำหรับพัฒนาและทดสอบระบบ Line Connect (PostgreSQL 16 + Redis 7)
version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: line_connect_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lineconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lineconnect_dev_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-line_connect_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lineconnect -d line_connect_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: line_connect_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
