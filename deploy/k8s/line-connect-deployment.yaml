# Kubernetes Manifest สำหรับระบบ Line Connect (ไทวัสดุ และ BnB Home) บน EKS / GKE / AKS
apiVersion: apps/v1
kind: Deployment
metadata:
  name: line-connect-api
  namespace: line-connect-prod
  labels:
    app: line-connect-api
    tier: backend
    owner: it-division
spec:
  replicas: 3
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: line-connect-api
  template:
    metadata:
      labels:
        app: line-connect-api
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3000'
        prometheus.io/path: '/metrics'
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: ghcr.io/thaiwatsadu-it/line-connect-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: line-connect-config
            - secretRef:
                name: line-connect-secrets
          resources:
            requests:
              cpu: '250m'
              memory: '512Mi'
            limits:
              cpu: '1000m'
              memory: '1024Mi'
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: line-connect-api-svc
  namespace: line-connect-prod
spec:
  selector:
    app: line-connect-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: line-connect-api-hpa
  namespace: line-connect-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: line-connect-api
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
